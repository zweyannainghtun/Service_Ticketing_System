spring.application.name=ticketing

spring.datasource.url = jdbc:mysql://localhost:3306/ticketing_service?createDatabaseIfNotExist=true
spring.datasource.username = root
spring.datasource.password = ${DB_PASSWORD}
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver
spring.datasource.tomcat.init-s-q-l=SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci

spring.jpa.database=mysql
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.format_sql=true
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false


# Email SMTP Configuration (Gmail)

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=zweyanaingtun@gmail.com
spring.mail.password= ${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB





# JWT Configuration
app.jwt.secret= ${JWT_SECRET_KEY}

# Access Token Expiration (ဥပမာ - ၁၅ မိနစ်)
app.jwt.expiration=86400000

# Refresh Token Expiration (ဥပမာ - ၇ ရက်)
app.jwt.refresh-expiration=604800000
